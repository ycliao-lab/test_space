<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界天氣查詢</title>
    <style>
        /* ===== CSS 變數系統 (Design Token System) ===== */
        :root {
            /* 色彩系統 */
            --color-primary-light: #2196F3;
            --color-primary-dark: #1565C0;
            --color-secondary: #667eea;
            --color-secondary-dark: #764ba2;
            --color-danger: #ff4444;
            --color-danger-dark: #cc0000;
            --color-bg-light: #f5f7fa;
            --color-bg-secondary: #c3cfe2;
            --color-bg-white: #ffffff;
            --color-text-dark: #333333;
            --color-text-gray: #555555;
            --color-text-light: #999999;
            --color-border: #e0e0e0;
            --color-border-dark: #ddd;
            --color-error-bg: #fee;
            --color-error-text: #c33;
            --color-button-bg: #f0f0f0;

            /* 間距系統 */
            --spacing-xs: 8px;
            --spacing-sm: 10px;
            --spacing-md: 15px;
            --spacing-lg: 20px;
            --spacing-xl: 30px;
            --spacing-2xl: 40px;

            /* 圓角系統 */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 15px;
            --radius-xl: 20px;

            /* 陰影系統 */
            --shadow-md: 0 20px 60px rgba(0, 0, 0, 0.3);

            /* 排版系統 */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-size-sm: 12px;
            --font-size-md: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 24px;
            --font-size-2xl: 28px;
            --font-size-3xl: 48px;

            /* 動畫系統 */
            --transition-fast: 0.2s;
            --transition-normal: 0.3s;
        }

        /* ===== Reset 樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 全局樣式 ===== */
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        /* ===== Container Component ===== */
        .container {
            background: var(--color-bg-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: var(--spacing-2xl);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: var(--spacing-xl);
            font-size: var(--font-size-2xl);
        }

        /* ===== Search Box Component ===== */
        .search-box {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
        }

        input[type="text"] {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            transition: border-color var(--transition-normal);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-secondary);
        }

        /* ===== Button Component ===== */
        button {
            padding: var(--spacing-md) var(--spacing-lg);
            background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-secondary-dark) 100%);
            color: var(--color-bg-white);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: bold;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Button Variant: Search Button */
        .search-btn {
            background: linear-gradient(135deg, var(--color-danger) 0%, var(--color-danger-dark) 100%) !important;
        }

        /* ===== Weather Info Component ===== */
        .weather-info {
            display: none;
        }

        .weather-info.show {
            display: block;
        }

        .city-name {
            font-size: var(--font-size-xl);
            font-weight: bold;
            color: var(--color-text-dark);
            margin-bottom: var(--spacing-md);
        }

        /* ===== Weather Card Component ===== */
        .weather-card {
            background: linear-gradient(135deg, var(--color-bg-light) 0%, var(--color-bg-secondary) 100%);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .temperature {
            font-size: var(--font-size-3xl);
            font-weight: bold;
            color: var(--color-secondary);
            text-align: center;
            margin-bottom: var(--spacing-sm);
        }

        .weather-description {
            text-align: center;
            color: var(--color-text-gray);
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-lg);
            text-transform: capitalize;
        }

        /* ===== Weather Details Component ===== */
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .detail-item {
            background: var(--color-bg-white);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            text-align: center;
        }

        .detail-label {
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            margin-bottom: var(--spacing-sm);
        }

        .detail-value {
            color: var(--color-text-dark);
            font-size: var(--font-size-lg);
            font-weight: bold;
        }

        /* ===== Status Messages Component ===== */
        .error-message {
            background: var(--color-error-bg);
            color: var(--color-error-text);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-xl);
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: var(--color-secondary);
            font-weight: bold;
            display: none;
            margin-top: var(--spacing-xl);
        }

        .loading.show {
            display: block;
        }

        /* ===== Suggested Cities Component ===== */
        .suggested-cities {
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 2px solid var(--color-border);
        }

        .suggested-cities h3 {
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-sm);
            text-transform: uppercase;
        }

        .cities-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
        }

        /* ===== City Button Component ===== */
        .city-btn {
            padding: var(--spacing-xs) var(--spacing-md);
            background: var(--color-button-bg);
            color: var(--color-text-dark);
            border: 1px solid var(--color-border-dark);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--font-size-sm);
            transition: all var(--transition-fast);
        }

        .city-btn:hover {
            background: var(--color-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 世界天氣查詢</h1>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="輸入城市名稱 (例如: 台北、東京、紐約)"
                autocomplete="off"
            >
            <button class="search-btn" onclick="searchWeather()">搜尋</button>
        </div>

        <div class="loading" id="loading">
            加載中...
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="weather-info" id="weatherInfo">
            <div class="city-name" id="cityName"></div>
            <div class="weather-card">
                <div class="temperature" id="temperature"></div>
                <div class="weather-description" id="weatherDescription"></div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">體感溫度</div>
                        <div class="detail-value" id="feelsLike"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">濕度</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">風速</div>
                        <div class="detail-value" id="windSpeed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">氣壓</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="suggested-cities">
            <h3>熱門城市</h3>
            <div class="cities-list">
                <button class="city-btn" onclick="searchCity('台北')">台北</button>
                <button class="city-btn" onclick="searchCity('東京')">東京</button>
                <button class="city-btn" onclick="searchCity('倫敦')">倫敦</button>
                <button class="city-btn" onclick="searchCity('紐約')">紐約</button>
                <button class="city-btn" onclick="searchCity('巴黎')">巴黎</button>
                <button class="city-btn" onclick="searchCity('香港')">香港</button>
                <button class="city-btn" onclick="searchCity('新加坡')">新加坡</button>
                <button class="city-btn" onclick="searchCity('雪梨')">雪梨</button>
            </div>
        </div>
    </div>

    <script>
        // ===== API 配置 (Production Configuration) =====
        const API_CONFIG = {
            GEO_API: 'https://nominatim.openstreetmap.org/search',
            WEATHER_API: 'https://api.open-meteo.com/v1/forecast',
            GEO_TIMEOUT: 5000,
            WEATHER_TIMEOUT: 5000,
        };

        // ===== DOM 管理器 Component =====
        const DOMManager = {
            elements: {
                cityInput: null,
                weatherInfo: null,
                errorMessage: null,
                loading: null,
                temperature: null,
                weatherDescription: null,
                humidity: null,
                windSpeed: null,
                pressure: null,
                feelsLike: null,
                cityName: null,
            },

            init() {
                this.elements.cityInput = document.getElementById('cityInput');
                this.elements.weatherInfo = document.getElementById('weatherInfo');
                this.elements.errorMessage = document.getElementById('errorMessage');
                this.elements.loading = document.getElementById('loading');
                this.elements.temperature = document.getElementById('temperature');
                this.elements.weatherDescription = document.getElementById('weatherDescription');
                this.elements.humidity = document.getElementById('humidity');
                this.elements.windSpeed = document.getElementById('windSpeed');
                this.elements.pressure = document.getElementById('pressure');
                this.elements.feelsLike = document.getElementById('feelsLike');
                this.elements.cityName = document.getElementById('cityName');
            },

            showLoading() {
                this.elements.loading.classList.add('show');
                this.elements.weatherInfo.classList.remove('show');
                this.elements.errorMessage.classList.remove('show');
            },

            hideLoading() {
                this.elements.loading.classList.remove('show');
            },

            showWeatherInfo() {
                this.elements.weatherInfo.classList.add('show');
                this.elements.errorMessage.classList.remove('show');
            },

            showError(message) {
                this.elements.errorMessage.textContent = message;
                this.elements.errorMessage.classList.add('show');
                this.elements.weatherInfo.classList.remove('show');
            }
        };

        // ===== 天氣數據轉換器 Component =====
        const WeatherTransformer = {
            // WMO 天氣碼映射表
            WEATHER_CODES: {
                0: '晴朗', 1: '主要晴朗', 2: '部分多雲', 3: '陰天',
                45: '霧', 48: '沈降霧',
                51: '小雨', 53: '中等雨', 55: '大雨',
                61: '小雨', 63: '中等雨', 65: '大雨',
                71: '小雪', 73: '中等雪', 75: '大雪', 77: '雪粒',
                80: '小陣雨', 81: '中等陣雨', 82: '大陣雨',
                85: '小雪陣', 86: '大雪陣',
                95: '雷暴', 96: '帶冰雹的雷暴', 99: '帶大冰雹的雷暴'
            },

            getWeatherDescription(code) {
                return this.WEATHER_CODES[code] || '未知';
            },

            formatTemperature(value) {
                return Math.round(value) + '°C';
            },

            formatHumidity(value) {
                return value + '%';
            },

            formatWindSpeed(value) {
                return Math.round(value) + ' km/h';
            },

            formatPressure(value) {
                return Math.round(value) + ' hPa';
            },

            transform(weatherData, cityName) {
                const current = weatherData.current;
                return {
                    cityName: cityName,
                    temperature: this.formatTemperature(current.temperature_2m),
                    feelsLike: this.formatTemperature(current.apparent_temperature),
                    humidity: this.formatHumidity(current.relative_humidity_2m),
                    windSpeed: this.formatWindSpeed(current.wind_speed_10m),
                    pressure: this.formatPressure(current.pressure_msl),
                    weatherDescription: this.getWeatherDescription(current.weather_code)
                };
            }
        };

        // ===== API 服務 Component =====
        const APIService = {
            async fetchWithTimeout(url, timeout) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    throw error;
                }
            },

            async getGeoData(city) {
                const params = new URLSearchParams({
                    q: city,
                    format: 'json',
                    limit: 1
                });

                const response = await this.fetchWithTimeout(
                    `${API_CONFIG.GEO_API}?${params}`,
                    API_CONFIG.GEO_TIMEOUT
                );
                
                if (!response.ok) throw new Error('地理信息查詢失敗');
                return await response.json();
            },

            async getWeatherData(lat, lon) {
                const params = new URLSearchParams({
                    latitude: lat,
                    longitude: lon,
                    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl',
                    wind_speed_unit: 'kmh',
                    temperature_unit: 'celsius',
                    timezone: 'auto'
                });

                const response = await this.fetchWithTimeout(
                    `${API_CONFIG.WEATHER_API}?${params}`,
                    API_CONFIG.WEATHER_TIMEOUT
                );
                
                if (!response.ok) throw new Error('天氣查詢失敗');
                return await response.json();
            }
        };

        // ===== 天氣應用核心邏輯 Component =====
        const WeatherApp = {
            async searchCity(city) {
                const trimmedCity = city.trim();
                
                if (!trimmedCity) {
                    DOMManager.showError('請輸入城市名稱');
                    return;
                }

                DOMManager.cityInput.value = trimmedCity;
                DOMManager.showLoading();

                try {
                    // 第一步：獲取地理位置數據
                    const geoData = await APIService.getGeoData(trimmedCity);
                    
                    if (!geoData || geoData.length === 0) {
                        DOMManager.showError('找不到該城市，請檢查拼寫');
                        return;
                    }

                    const { lat, lon, display_name } = geoData[0];
                    const cityName = display_name.split(',')[0];

                    // 第二步：獲取天氣數據
                    const weatherData = await APIService.getWeatherData(lat, lon);

                    // 第三步：轉換數據
                    const transformedData = WeatherTransformer.transform(weatherData, cityName);

                    // 第四步：更新 UI
                    this.updateUI(transformedData);

                } catch (error) {
                    console.error('Error:', error);
                    
                    let errorMsg = '無法獲取天氣信息，請重試';
                    if (error.name === 'AbortError') {
                        errorMsg = '請求超時，請檢查網絡連接';
                    }
                    
                    DOMManager.showError(errorMsg);
                } finally {
                    DOMManager.hideLoading();
                }
            },

            updateUI(data) {
                DOMManager.elements.cityName.textContent = data.cityName;
                DOMManager.elements.temperature.textContent = data.temperature;
                DOMManager.elements.feelsLike.textContent = data.feelsLike;
                DOMManager.elements.humidity.textContent = data.humidity;
                DOMManager.elements.windSpeed.textContent = data.windSpeed;
                DOMManager.elements.pressure.textContent = data.pressure;
                DOMManager.elements.weatherDescription.textContent = data.weatherDescription;

                DOMManager.showWeatherInfo();
            }
        };

        // ===== 事件監聽器初始化 =====
        function initEventListeners() {
            DOMManager.elements.cityInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    WeatherApp.searchCity(DOMManager.elements.cityInput.value);
                }
            });
        }

        // ===== 應用初始化 =====
        function initApp() {
            DOMManager.init();
            initEventListeners();
        }

        // ===== Window 全局方法 (用於 HTML 內聯事件) =====
        window.searchWeather = () => {
            WeatherApp.searchCity(DOMManager.elements.cityInput.value);
        };

        window.searchCity = (city) => {
            WeatherApp.searchCity(city);
        };

        // ===== 應用啟動 =====
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
